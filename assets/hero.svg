<text x="70" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" fill="#c9d1d9">A short, illustrated news issue a few times a day.</text>
<text x="70" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="22" fill="#9198a1">Picked from <tspan fill="#ff8a5c" font-weight="700">your own projects</tspan>, written in <tspan fill="#ff8a5c" font-weight="700">your own language</tspan>.</text>
