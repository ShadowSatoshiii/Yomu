<text x="78" y="32" font-family="ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="3" fill="#ff8a5c">01 / 06</text>
<text x="78" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f0f6fc">Why Dispatch?</text>
